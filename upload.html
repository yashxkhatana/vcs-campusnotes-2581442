<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Upload notes · CampusNotes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h2>Upload notes</h2>
    <form>
      <label>Subject <input name="subject" required></label>
      <label>Title <input name="title" required></label>
      <label>File <input type="file" name="file" accept=".pdf"></label>
      <button type="submit">Upload</button>
    </form>
  </main>
</body>
</html>
